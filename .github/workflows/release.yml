name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pack TOS App Center archive
        run: |
          cd deploy/nas
          tar czf kkfieldlogger.tar.gz config.ini kkfieldlogger.lang kkfieldlogger.svg docker-compose.yml
      - name: Create release with package asset
        uses: softprops/action-gh-release@v2
        with:
          files: deploy/nas/kkfieldlogger.tar.gz
          generate_release_notes: true
