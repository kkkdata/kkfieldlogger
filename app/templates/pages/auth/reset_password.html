<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset Password | KK Field Logger</title>
    <link rel="stylesheet" href="/site.css">
</head>
<body>
    <div class="site-shell">
        <header class="site-header">
            <div class="site-brand">KK Field Logger</div>
            <nav class="site-nav">
                <a href="/">Home</a>
                <a href="/login">Login</a>
                <a href="/support">Support</a>
            </nav>
        </header>
        <main class="site-main">
            <div class="card" style="max-width: 640px; margin: 0 auto;">
                <h1>Reset Password</h1>
                {% if error %}
                <div class="banner visible error">
                    {% if error == "password_too_short" %}
                    Password must be at least 10 characters.
                    {% else %}
                    The reset link is invalid or expired.
                    {% endif %}
                </div>
                {% endif %}
                <form method="post" action="/auth/reset-password" class="form-grid">
                    <input type="hidden" name="token" value="{{ token }}">
                    <label>New Password
                        <input type="password" name="new_password" minlength="10" required>
                    </label>
                    <button type="submit" class="btn">Update Password</button>
                </form>
            </div>
        </main>
        <footer class="site-footer">K&amp;K Data Service Inc.</footer>
    </div>
</body>
</html>
