log_format kk_host_combined '$remote_addr - $host [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" "$http_x_forwarded_for"';
limit_req_zone $binary_remote_addr zone=public_lead_submit:10m rate=6r/m;

# Resolve the app upstream through Docker's embedded DNS so nginx follows
# container recreation instead of caching a stale IP (historical 502 cause).
resolver 127.0.0.11 valid=30s ipv6=off;

server {
    listen 80 default_server;
    server_name api2.kkdatasvc.com api1.kkdatasvc.com _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 80;
    server_name kkdatasvc.com www.kkdatasvc.com;
    access_log /dev/stdout kk_host_combined;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name kkdatasvc.com www.kkdatasvc.com;
    access_log /dev/stdout kk_host_combined;
    root /usr/share/nginx/html/company-site;
    index index.html;
    set $app_upstream http://app:8000;

    ssl_certificate /etc/letsencrypt/live/kkdatasvc.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kkdatasvc.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "no-cache" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow:\n";
    }

    # Drop common scanner probes before they reach the app.
    location ~* \.(php|asp|aspx|jsp|cgi)$ { access_log off; return 444; }
    location ~ /\. { access_log off; return 444; }

    location = /api/v2/public/support-request {
        limit_req zone=public_lead_submit burst=3 nodelay;
        limit_req_status 429;
        proxy_pass $app_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/v2/public/home-inquiry {
        limit_req zone=public_lead_submit burst=3 nodelay;
        limit_req_status 429;
        proxy_pass $app_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/ { return 404; }
    location ^~ /logs/ { return 404; }
    location ^~ /private/ { return 404; }
    location ^~ /portal { return 404; }
    location ^~ /auth/ { return 404; }
    location ^~ /media/ { return 404; }
    location ^~ /h5/ { return 404; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}


