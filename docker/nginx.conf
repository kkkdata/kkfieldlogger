server {
    listen 443 ssl;
    server_name api1.kkdatasvc.com;
    root /usr/share/nginx/html/public;
    set $app_upstream http://app:8000;

    ssl_certificate /etc/letsencrypt/live/api1.kkdatasvc.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api1.kkdatasvc.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https://unpkg.com https://tile.openstreetmap.org https://*.tile.openstreetmap.org; style-src 'self' 'unsafe-inline' https://unpkg.com; script-src 'self' 'unsafe-inline' https://unpkg.com; connect-src 'self'; font-src 'self' data: https://unpkg.com;" always;
    client_max_body_size 100m;
    client_body_timeout 300s;
    client_body_buffer_size 16m;
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    # Emergency abuse control: public workspace registration is disabled.
    # Registration is open but throttled: submissions sit silently in the
    # platform review queue; email goes out only after a human approves.
    location ^~ /auth/register-company {
        limit_req zone=public_lead_submit burst=3 nodelay;
        limit_req_status 429;
        proxy_pass $app_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /api/v2/auth/register {
        limit_req zone=public_lead_submit burst=3 nodelay;
        limit_req_status 429;
        proxy_pass $app_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # Drop common scanner probes before they reach the app.
    location ~* \.(php|asp|aspx|jsp|cgi)$ { access_log off; return 444; }
    location ~ /\. { access_log off; return 444; }

    location = /h5 {
        return 301 https://$host/h5/;
    }

    location = /h5/manifest.webmanifest {
        default_type application/manifest+json;
        try_files /h5/manifest.webmanifest =404;
    }

    location ^~ /h5/ {
        try_files $uri $uri/ /h5/index.html;
    }

    location /media/ {
        proxy_pass $app_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/ {
        proxy_pass $app_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /portal {
        proxy_pass $app_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /auth/ {
        proxy_pass $app_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /static/ {
        proxy_pass $app_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri.html $uri/ @api1_app;
    }

    location @api1_app {
        proxy_pass $app_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

