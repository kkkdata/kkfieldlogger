services:
  db:
    # pgvector build of postgres: migration 20260402_0006 runs
    # CREATE EXTENSION vector, which stock postgres:16 does not ship.
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${KK_POSTGRES_DB:-kklogger}
      POSTGRES_USER: ${KK_POSTGRES_USER:-kklogger}
      POSTGRES_PASSWORD: ${KK_POSTGRES_PASSWORD:-secure_password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ${KK_DB_DATA_DIR:-/opt/postgres-data}:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v2/healthz', timeout=5)\""]
      start_period: 120s
      interval: 20s
      timeout: 5s
      retries: 5
    volumes:
      - ${KK_STORAGE_ROOT:-/mnt/movies/kkdata}:/mnt/movies/kkdata
      - ${KK_LOGS_HOST_DIR:-./logs}:${KK_LOG_DIR:-/app/logs}

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    command: ["./docker/worker-entrypoint.sh"]
    healthcheck:
      # The worker loop touches this file every iteration; a stale mtime
      # means the loop is stuck (e.g. waiting forever on migrations).
      test: ["CMD-SHELL", "python -c \"import os,time,sys; sys.exit(0 if time.time()-os.path.getmtime('/tmp/kk-worker-heartbeat')<90 else 1)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 320s
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ${KK_STORAGE_ROOT:-/mnt/movies/kkdata}:/mnt/movies/kkdata
      - ${KK_LOGS_HOST_DIR:-./logs}:${KK_LOG_DIR:-/app/logs}

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
      worker:
        condition: service_started
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./app/static/public:/usr/share/nginx/html/public:ro
      - ${KK_STORAGE_ROOT:-/mnt/movies/kkdata}:/mnt/movies/kkdata:ro
